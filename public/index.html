<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northflank Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>🚀 Northflank Demo App</h1>
    <p>Your web application is deployed and running live!</p>
    <button id="pingBtn">Check API Health</button>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('pingBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        document.getElementById('result').innerHTML = `Status: <strong>${data.status}</strong><br>Time: ${data.timestamp}`;
      } catch (err) {
        document.getElementById('result').innerText = 'Failed to reach API server.';
      }
    });
  </script>
</body>
</html>
